name: macOS runner validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build without publishing
        run: cargo build --locked --release --bin py2pyd --target ${{ matrix.target }}
      - name: Verify native architecture and record minimum OS
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/py2pyd"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          file "$binary"
          lipo -verify_arch "$EXPECTED_ARCH" "$binary"
          xcrun vtool -show-build "$binary"
          "$binary" --version
