name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  schedule:
    - cron: '00 01 * * *'

permissions:
  contents: read
  actions: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Testing across platforms
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # py2pyd refuses to run without a compiler on PATH; on Windows that means
      # the MSVC tools, which the runner image does not export by default.
      - name: Add MSVC to PATH (Windows)
        if: runner.os == 'Windows'
        # Pinned to an immutable commit instead of the rolling `v1` tag, which
        # silently moves whenever upstream retags. The pinned commit is the tip
        # of v1.13.0 and ships a Node 24 runtime, so it no longer trips the
        # Node 20 deprecation warning that the older `v1` resolution pulled in.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Regression guard for the Windows uv resolution defect: the test matrix
      # must also pass on a runner that starts with no `uv` on PATH, because
      # installing `uv` only updates the persisted user PATH and is invisible to
      # the already-running process. `find_uv_executable` resolves the install
      # directory directly, so this only widens coverage -- it is not the fix.
      - name: Hide preinstalled uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uv = Get-Command uv -ErrorAction SilentlyContinue
          if (-not $uv) {
            Write-Host "uv not preinstalled; the fresh-install path is exercised as-is"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\uv-hidden" | Out-Null
          # Record where uv came from: `Get-Command uv` cannot answer once uv is
          # hidden, so the restore step has nothing to look up.
          $uv.Source | Set-Content -Path "$env:RUNNER_TEMP\uv-hidden\original-path.txt"
          Move-Item -Path $uv.Source -Destination "$env:RUNNER_TEMP\uv-hidden\" -Force
          Write-Host "moved $($uv.Source) out of PATH"

      - name: Build
        run: cargo build --verbose --workspace

      - name: Run tests
        run: cargo test --verbose --workspace

      - name: Restore preinstalled uv (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $hidden = "$env:RUNNER_TEMP\uv-hidden"
          $pathFile = Join-Path $hidden 'original-path.txt'
          if (-not (Test-Path $pathFile)) {
            Write-Host "no hidden uv to restore"
            exit 0
          }
          # The original location is read back from the file written when uv was
          # hidden. Looking it up with `Get-Command uv` here cannot work: uv is
          # still hidden at this point, so the lookup returns `$null` and
          # `Move-Item` would quietly do nothing.
          $originalPath = (Get-Content -Path $pathFile -Raw).Trim()
          Get-ChildItem -Path $hidden -File | Where-Object { $_.Name -ne 'original-path.txt' } | ForEach-Object {
            Write-Host "restoring $($_.Name) to $originalPath"
            Move-Item -Path $_.FullName -Destination $originalPath -Force
          }
          Write-Host "restored uv to $originalPath"

  # Security audit using rustsec database
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # `rustsec/audit-check` is deliberately not used here: on `schedule`
      # events it reports findings by opening GitHub issues instead of
      # publishing a check run, which requires `issues: write`. Without that
      # scope the job failed with "Resource not accessible by integration"
      # every night even though `cargo audit` reported zero vulnerabilities.
      # Calling `cargo audit` directly exits non-zero only for real
      # vulnerabilities, so scheduled, push and pull_request runs behave
      # identically and informational warnings no longer turn the job red.
      - name: Run security audit
        run: |
          # hickory-proto 0.25.2 is pulled in by turbo-cdn, which pins
          # hickory-resolver = "0.25" as a non-optional dependency.
          # RUSTSEC-2026-0118 has no patched release at all, and
          # RUSTSEC-2026-0119 is only fixed in hickory-proto 0.26.1, which
          # turbo-cdn does not accept. Neither is reachable by a version bump,
          # so they are ignored until turbo-cdn relaxes its hickory-resolver
          # requirement. Revisit on every turbo-cdn upgrade.
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119

  # Formatting check
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # Documentation check
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --workspace

  # Code coverage reporting (only on PR)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          flags: unittests
          name: codecov-umbrella


